name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python deps
        run: pip install pyinstaller==6.* numpy
      - name: ffmpeg (GPL build with libx264, BtbN)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force ffbin | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe","$bin\ffplay.exe" ffbin\
          Copy-Item (Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName ffbin\FFMPEG-LICENSE.txt
      - name: Tests (firmware patch data integrity, looks graph, library)
        run: python tests/test_static.py && python tests/test_library.py
      - name: Build GR8DVR.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name GR8DVR --paths app
          --icon app/gr8core/data/gr8dvr.ico
          --add-data "app/gr8core/data;gr8core/data"
          --add-data "app/gr8core/LICENSE-open-minidvr-50i.txt;."
          --add-binary "ffbin/ffmpeg.exe;." --add-binary "ffbin/ffprobe.exe;." --add-binary "ffbin/ffplay.exe;."
          --add-data "ffbin/FFMPEG-LICENSE.txt;." --add-data "NOTICES.txt;."
          app/gr8dvr.py
      - name: Smoke test (bundled ffmpeg runs)
        run: ffbin\ffmpeg.exe -hide_banner -encoders | findstr libx264
      - uses: actions/upload-artifact@v4
        with: { name: GR8DVR-windows, path: dist/GR8DVR.exe }

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest,    arch: arm64, py: arm64, mach: arm64,  label: AppleSilicon }
          - { runner: macos-15-intel,  arch: amd64, py: x64,   mach: x86_64, label: Intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.py }}
      - name: Python deps
        run: python -m pip install pyinstaller==6.* numpy
      - name: ffmpeg (static macOS build with libx264/libx265, martin-riedl.de)
        run: |
          mkdir -p ffbin
          for t in ffmpeg ffprobe ffplay; do
            curl -fsSL -o $t.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.arch }}/release/$t.zip"
            unzip -o -q $t.zip -d ffbin
          done
          chmod +x ffbin/*
          file ffbin/ffmpeg
          printf 'FFmpeg - https://ffmpeg.org - GNU GPL v3 build (static, from https://ffmpeg.martin-riedl.de).\nSource code: https://ffmpeg.org/download.html\n' > ffbin/FFMPEG-LICENSE.txt
      - name: Tests (firmware patch data integrity, looks graph, library)
        run: python tests/test_static.py && python tests/test_library.py
      - name: Smoke test (bundled ffmpeg runs)
        run: ffbin/ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Build GR8DVR.app
        run: >
          pyinstaller --noconfirm --windowed --name GR8DVR --paths app
          --icon app/gr8core/data/gr8dvr.icns
          --osx-bundle-identifier xyz.gr8success.gr8dvr
          --add-data "app/gr8core/data:gr8core/data"
          --add-data "app/gr8core/LICENSE-open-minidvr-50i.txt:."
          --add-binary "ffbin/ffmpeg:." --add-binary "ffbin/ffprobe:." --add-binary "ffbin/ffplay:."
          --add-data "ffbin/FFMPEG-LICENSE.txt:." --add-data "NOTICES.txt:."
          app/gr8dvr.py
      - name: Check the app is built for ${{ matrix.mach }}
        run: |
          file dist/GR8DVR.app/Contents/MacOS/GR8DVR | tee /dev/stderr | grep -q "${{ matrix.mach }}"
          file ffbin/ffmpeg | grep -q "${{ matrix.mach }}"
      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GR8DVR.app GR8DVR-macOS-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GR8DVR-macOS-${{ matrix.label }}
          path: GR8DVR-macOS-${{ matrix.label }}.zip

  release:
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Version
        id: ver
        run: echo "v=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" app/gr8core/__init__.py)" >> "$GITHUB_OUTPUT"
      - run: ls -la out
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: GR8DVR ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            GR8DVR ${{ steps.ver.outputs.v }} - free firmware builder + MiniDV / Mini DVR media toolkit.

            - Windows 10 / 11: GR8DVR.exe (Windows may warn "unrecognised app": More info -> Run anyway)
            - macOS 11+ on Apple Silicon (M1-M4): GR8DVR-macOS-AppleSilicon.zip
            - macOS 11+ on Intel: GR8DVR-macOS-Intel.zip
              (unzip, drag GR8DVR to Applications, then right-click -> Open the first time;
               on macOS 15+: System Settings -> Privacy & Security -> Open Anyway)

            Install guide, FAQ and credits: https://gr8success.xyz/pages/gr8dvr
          files: out/*
