name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python deps
        run: pip install pyinstaller==6.* numpy
      - name: ffmpeg (GPL build with libx264, BtbN)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force ffbin | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe","$bin\ffplay.exe" ffbin\
          Copy-Item (Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName ffbin\FFMPEG-LICENSE.txt
      - name: Tests (firmware patch data integrity, looks graph)
        run: python tests/test_static.py && python tests/test_library.py
      - name: Build GR8DVR.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name GR8DVR --paths app
          --icon app/gr8core/data/gr8dvr.ico
          --add-data "app/gr8core/data;gr8core/data"
          --add-data "app/gr8core/LICENSE-open-minidvr-50i.txt;."
          --add-binary "ffbin/ffmpeg.exe;." --add-binary "ffbin/ffprobe.exe;." --add-binary "ffbin/ffplay.exe;."
          --add-data "ffbin/FFMPEG-LICENSE.txt;." --add-data "NOTICES.txt;."
          app/gr8dvr.py
      - name: Smoke test (bundled ffmpeg runs)
        run: ffbin\ffmpeg.exe -hide_banner -encoders | findstr libx264
      - uses: actions/upload-artifact@v4
        with: { name: GR8DVR-windows, path: dist/GR8DVR.exe }
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/gr8core/__init__.py -Pattern "VERSION\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: GR8DVR ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            GR8DVR ${{ steps.ver.outputs.v }} - free firmware builder + MiniDV / Mini DVR media toolkit for Windows 10/11.
            Download GR8DVR.exe below (Windows may warn "unrecognised app": More info -> Run anyway).
            Install guide, FAQ and credits: https://gr8success.xyz/pages/gr8dvr
          files: dist/GR8DVR.exe
